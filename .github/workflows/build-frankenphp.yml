name: Build and Push FrankenPHP Image (experimental)

on:
  push:
    branches: [main, feature/frankenphp]
    paths:
      - 'Dockerfile.frankenphp'
      - 'entrypoint-frankenphp.sh'
      - 'frankenphp/**'
      - 'DOCKERHUB_FRANKENPHP_OVERVIEW.md'
      - '.github/workflows/build-frankenphp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest ChurchCRM version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ChurchCRM/CRM/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Could not resolve latest ChurchCRM version (got '$LATEST')"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Ensure Docker Hub repository exists
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"username": "${{ secrets.DOCKER_HUB_USER }}", "password": "${{ secrets.DOCKER_HUB_TOKEN }}"}' \
            | jq -r '.token')
          REPO="${{ secrets.DOCKER_HUB_USER }}/churchcrm-frankenphp"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/$REPO/")
          if [ "$CODE" != "200" ]; then
            echo "Creating $REPO"
            curl -sf -X POST "https://hub.docker.com/v2/repositories/" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"namespace\": \"${{ secrets.DOCKER_HUB_USER }}\", \"name\": \"churchcrm-frankenphp\", \"is_private\": false, \"description\": \"EXPERIMENTAL community ChurchCRM image on FrankenPHP (unofficial)\"}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frankenphp
          build-args: |
            CHURCHCRM_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKER_HUB_USER }}/churchcrm-frankenphp:latest
            ${{ secrets.DOCKER_HUB_USER }}/churchcrm-frankenphp:${{ steps.version.outputs.version }}

  update-dockerhub-description:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update DockerHub description
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"username": "${{ secrets.DOCKER_HUB_USER }}", "password": "${{ secrets.DOCKER_HUB_TOKEN }}"}' \
            | jq -r '.token')
          curl -sf -X PATCH "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_HUB_USER }}/churchcrm-frankenphp/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"full_description\": $(jq -Rs . < DOCKERHUB_FRANKENPHP_OVERVIEW.md)}"

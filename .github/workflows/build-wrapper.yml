name: Build and Push Wrapper Image (official base)

# Thin wrapper over the official churchcrm/crm image (see Dockerfile.upstream).
# Manual only and publishes ONLY <version>-<tag_suffix>: it never touches :latest, the major
# tag or <version>, so it cannot affect the stable image or the scheduled builds.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ChurchCRM version (empty = latest GitHub release). Must exist as churchcrm/crm:<version>-php8-apache'
        type: string
        default: ''
      tag_suffix:
        description: 'Published tag is <version>-<suffix>'
        type: string
        default: 'official'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/ChurchCRM/CRM/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid ChurchCRM version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the official image exists
        run: |
          docker buildx imagetools inspect \
            "churchcrm/crm:${{ steps.version.outputs.version }}-php8-apache" > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.upstream
          build-args: |
            CHURCHCRM_VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: churchcrm-wrapper:test

      - name: Smoke test
        run: |
          docker run -d --name crm-smoke --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:8080:8080 churchcrm-wrapper:test
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$CODE" = "302" ] && break
            sleep 2
          done
          echo "GET / -> $CODE"
          [ "$CODE" = "302" ] || { docker logs crm-smoke; exit 1; }
          UID_IN=$(docker exec crm-smoke id -u)
          echo "uid in container: $UID_IN"
          [ "$UID_IN" = "33" ]
          UPLOAD=$(docker exec crm-smoke php -r 'echo ini_get("upload_max_filesize");')
          echo "upload_max_filesize: $UPLOAD"
          [ "$UPLOAD" = "100M" ]
          docker rm -f crm-smoke

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.upstream
          build-args: |
            CHURCHCRM_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKER_HUB_USER }}/churchcrm:${{ steps.version.outputs.version }}-${{ inputs.tag_suffix }}

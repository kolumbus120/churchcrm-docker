name: Remove old Docker tags (one-off, January 2027)

# One-off job announced in DOCKERHUB_OVERVIEW.md ("Old tags will be removed").
# - Deletes ONLY the tags listed in TAGS below from kolumbus120/churchcrm, never a pattern.
# - Cron has no year, so it fires every 2 January, but the guard below makes it act in 2027 only
#   and the job disables its own workflow after a successful run.
# - Manual runs (workflow_dispatch) are a dry run unless dry_run is set to false.
# Deleting a workflow file needs a token with the "workflow" scope, which GITHUB_TOKEN cannot
# have, so after the run the (disabled) file can simply be deleted by hand.

on:
  schedule:
    - cron: '0 9 2 1 *'   # 2 January, 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true
      test_delete:
        description: 'Only test the Docker Hub Delete permission: create the throwaway tag delete-test and delete it again (touches nothing else)'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      REPO: kolumbus120/churchcrm
      TAGS: '7.3.1 7.3.3 7.4.0 7.4.1 7.4.2 7.4.3 7.5.0 7.5.1 7.7.1-rc2 7.7.1-rc3'
    steps:
      - name: Test the Delete permission (creates and deletes the tag delete-test)
        if: github.event_name == 'workflow_dispatch' && inputs.test_delete
        env:
          HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$HUB_TOKEN" | docker login -u "$HUB_USER" --password-stdin
          docker buildx imagetools create -t "$REPO:delete-test" "$REPO:7.8.1-official"
          JWT=$(curl -s -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\": \"$HUB_USER\", \"password\": \"$HUB_TOKEN\"}" | jq -r '.token')
          [ -n "$JWT" ] && [ "$JWT" != "null" ] || { echo "::error::Docker Hub login failed"; exit 1; }
          DEL=$(curl -s -o /dev/stderr -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $JWT" "https://hub.docker.com/v2/repositories/$REPO/tags/delete-test/")
          echo "DELETE delete-test -> $DEL"
          if [ "$DEL" = "204" ]; then
            echo "Delete permission OK"
          else
            echo "::error::DELETE failed with $DEL - the token has no Delete permission. The tag $REPO:delete-test was left behind, remove it by hand."
            exit 1
          fi

      - name: Guard (run only on or after 2027-01-01)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_delete }}" = "true" ]; then
            echo "Test mode - skipping the real run"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -lt 20270101 ]; then
            echo "Before 2027-01-01 - nothing to do (cron fires every year)"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2027" ]; then
            echo "Not 2027 - nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Delete tags
        if: steps.guard.outputs.run == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -u
          # Safety net: never touch these, even if someone edits TAGS by mistake.
          for t in $TAGS; do
            case "$t" in
              latest|7|7.6.*|7.7.0|7.7.1|7.8.*) echo "::error::Refusing to delete protected tag $t"; exit 1;;
            esac
          done

          if [ "$DRY_RUN" != "true" ]; then
            JWT=$(curl -s -X POST https://hub.docker.com/v2/users/login \
              -H 'Content-Type: application/json' \
              -d "{\"username\": \"$HUB_USER\", \"password\": \"$HUB_TOKEN\"}" | jq -r '.token')
            [ -n "$JWT" ] && [ "$JWT" != "null" ] || { echo "::error::Docker Hub login failed"; exit 1; }
          fi

          FAILED=0
          for t in $TAGS; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/$REPO/tags/$t/")
            if [ "$CODE" = "404" ]; then echo "$t: already gone"; continue; fi
            if [ "$DRY_RUN" = "true" ]; then echo "$t: WOULD delete (dry run)"; continue; fi
            DEL=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $JWT" "https://hub.docker.com/v2/repositories/$REPO/tags/$t/")
            echo "$t: DELETE -> $DEL"
            [ "$DEL" = "204" ] || [ "$DEL" = "404" ] || FAILED=1
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::Some tags were not deleted (does the Docker Hub token have the Delete permission?). Workflow stays enabled."
            exit 1
          fi

      - name: Disable this workflow after a real run
        if: steps.guard.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable remove-old-tags-2027.yml --repo "${{ github.repository }}"

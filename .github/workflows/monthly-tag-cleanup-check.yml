name: Monthly Tag Cleanup Check

on:
  schedule:
    - cron: '0 12 1 * *'  # 1st of every month at 12:00 UTC
  workflow_dispatch:

jobs:
  check-old-tags:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub tags
        run: python3 .github/scripts/check_old_tags.py "$RUNNER_TEMP/report.json"

      - name: Create or update GitHub issue if action is needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/report.json`, 'utf8'));
            if (!result.action_needed) {
              core.info('No tags need to be deleted.');
              return;
            }

            const body = [
              '## Docker Tag Cleanup Required',
              '',
              '@kolumbus120 These tags have not been pulled for more than 12 months:',
              '',
              ...result.delete_candidates.map(t =>
                `- \`${t.repo}:${t.name}\`: last pulled ${t.last_pulled} (${t.age_days} days ago)`),
              '',
              'Delete them in the Docker Hub UI (repository, Tags, select, Delete).',
              'Check first that nobody still depends on them.',
              '',
              '---',
              '*Generated by the automated monthly check*',
              '',
              '```',
              result.report,
              '```',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cleanup',
            });
            const existing = issues.find(i => i.title.includes('Docker Tag Cleanup'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Docker Tag Cleanup: Old tags should be deleted',
                body,
                assignees: ['kolumbus120'],
                labels: ['cleanup', 'maintenance', 'automated'],
              });
            }
